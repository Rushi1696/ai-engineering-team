# =============================================================================
# configs/agents.yaml
#
# Agent configurations for the 11-agent autonomous engineering pipeline.
#
# Supported providers:
#   - "fake": Deterministic test doubles (no API key or network required).
#   - "gemini": Google Gemini API via official google-genai SDK (requires GEMINI_API_KEY).
#               Supported models: gemini-3.8-flash, gemini-2.5-pro, gemini-1.5-flash, gemini-1.5-pro.
#               Verify current models at: https://ai.google.dev/gemini-api/docs/models/gemini
#   - "groq": Groq Cloud API via official groq SDK (requires GROQ_API_KEY).
#             Supported models: openai/gpt-oss-120b, qwen/qwen3.8-27b.
#             Verify current models at: https://console.groq.com/docs/models
# =============================================================================

workflow:
  max_debug_cycles: 10
  default_provider: "fake"  # Global fallback: "fake", "gemini", or "groq"
  budget:
    max_total_calls: 30
    max_prompt_chars_per_call: 40000
    max_total_prompt_chars: 150000

providers:
  gemini:
    default_model: "gemini-3.8-flash"
    max_output_tokens: 8192
    timeout_seconds: 60
  groq:
    default_model: "openai/gpt-oss-120b"
    max_output_tokens: 8192
    timeout_seconds: 60

agents:
  product_manager:
    model: "claude-3-5-sonnet-20241022"
    gemini_model: "gemini-3.8-flash"
    groq_model: "openai/gpt-oss-120b"
    max_retries: 3
    timeout_seconds: 120
    max_output_tokens: 8192

  architect:
    model: "claude-3-5-sonnet-20241022"
    gemini_model: "gemini-2.5-pro"
    groq_model: "openai/gpt-oss-120b"
    max_retries: 3
    timeout_seconds: 180
    max_output_tokens: 8192

  task_planner:
    model: "gpt-4o"
    gemini_model: "gemini-3.8-flash"
    groq_model: "openai/gpt-oss-120b"
    max_retries: 3
    timeout_seconds: 120
    max_output_tokens: 8192

  backend:
    model: "gpt-4o"
    gemini_model: "gemini-3.8-flash"
    groq_model: "openai/gpt-oss-120b"
    max_retries: 3
    timeout_seconds: 300
    max_output_tokens: 8192

  frontend:
    model: "gpt-4o"
    gemini_model: "gemini-3.8-flash"
    groq_model: "openai/gpt-oss-120b"
    max_retries: 3
    timeout_seconds: 300
    max_output_tokens: 8192

  qa:
    model: "gpt-4o-mini"
    gemini_model: "gemini-3.8-flash"
    groq_model: "qwen/qwen3.8-27b"
    max_retries: 3
    timeout_seconds: 300
    max_output_tokens: 8192

  debug:
    model: "claude-3-5-sonnet-20241022"
    gemini_model: "gemini-2.5-pro"
    groq_model: "openai/gpt-oss-120b"
    max_retries: 3
    timeout_seconds: 240
    max_output_tokens: 8192

  reviewer:
    model: "claude-3-5-sonnet-20241022"
    gemini_model: "gemini-2.5-pro"
    groq_model: "openai/gpt-oss-120b"
    max_retries: 3
    timeout_seconds: 360
    max_output_tokens: 8192

  devops:
    model: "gpt-4o"
    gemini_model: "gemini-3.8-flash"
    groq_model: "openai/gpt-oss-120b"
    max_retries: 3
    timeout_seconds: 180
    max_output_tokens: 8192

  documentation:
    model: "claude-3-haiku-20240307"
    gemini_model: "gemini-3.8-flash"
    groq_model: "qwen/qwen3.8-27b"
    max_retries: 3
    timeout_seconds: 240
    max_output_tokens: 8192

  final_project:
    model: "gpt-4o-mini"
    gemini_model: "gemini-3.8-flash"
    groq_model: "qwen/qwen3.8-27b"
    max_retries: 3
    timeout_seconds: 60
    max_output_tokens: 8192
