# =============================================================================
# configs/agents.yaml
#
# Agent configurations for the 11-agent autonomous engineering pipeline.
#
# Supported providers:
#   - "fake": Deterministic test doubles (no API key or network required).
#   - "gemini": Google Gemini API via official google-genai SDK (requires GEMINI_API_KEY).
#               Supported models: gemini-2.5-flash, gemini-2.5-pro, gemini-1.5-flash, gemini-1.5-pro.
#               Verify current models at: https://ai.google.dev/gemini-api/docs/models/gemini
#   - "groq": Groq Cloud API via official groq SDK (requires GROQ_API_KEY).
#             Supported models: llama-3.3-70b-versatile, llama-3.1-8b-instant, mixtral-8x7b-32768.
#             Verify current models at: https://console.groq.com/docs/models
# =============================================================================

workflow:
  max_debug_cycles: 10
  default_provider: "fake"  # Global fallback: "fake", "gemini", or "groq"

providers:
  gemini:
    default_model: "gemini-2.5-flash"
  groq:
    default_model: "llama-3.3-70b-versatile"

agents:
  product_manager:
    model: "claude-3-5-sonnet-20241022"
    gemini_model: "gemini-2.5-flash"
    groq_model: "llama-3.3-70b-versatile"
    max_retries: 3
    timeout_seconds: 120

  architect:
    model: "claude-3-5-sonnet-20241022"
    gemini_model: "gemini-2.5-pro"
    groq_model: "llama-3.3-70b-versatile"
    max_retries: 3
    timeout_seconds: 180

  task_planner:
    model: "gpt-4o"
    gemini_model: "gemini-2.5-flash"
    groq_model: "llama-3.3-70b-versatile"
    max_retries: 3
    timeout_seconds: 120

  backend:
    model: "gpt-4o"
    gemini_model: "gemini-2.5-flash"
    groq_model: "llama-3.3-70b-versatile"
    max_retries: 3
    timeout_seconds: 300

  frontend:
    model: "gpt-4o"
    gemini_model: "gemini-2.5-flash"
    groq_model: "llama-3.3-70b-versatile"
    max_retries: 3
    timeout_seconds: 300

  qa:
    model: "gpt-4o-mini"
    gemini_model: "gemini-2.5-flash"
    groq_model: "llama-3.1-8b-instant"
    max_retries: 3
    timeout_seconds: 300

  debug:
    model: "claude-3-5-sonnet-20241022"
    gemini_model: "gemini-2.5-pro"
    groq_model: "llama-3.3-70b-versatile"
    max_retries: 3
    timeout_seconds: 240

  reviewer:
    model: "claude-3-5-sonnet-20241022"
    gemini_model: "gemini-2.5-pro"
    groq_model: "llama-3.3-70b-versatile"
    max_retries: 3
    timeout_seconds: 360

  devops:
    model: "gpt-4o"
    gemini_model: "gemini-2.5-flash"
    groq_model: "llama-3.3-70b-versatile"
    max_retries: 3
    timeout_seconds: 180

  documentation:
    model: "claude-3-haiku-20240307"
    gemini_model: "gemini-2.5-flash"
    groq_model: "llama-3.1-8b-instant"
    max_retries: 3
    timeout_seconds: 240

  final_project:
    model: "gpt-4o-mini"
    gemini_model: "gemini-2.5-flash"
    groq_model: "llama-3.1-8b-instant"
    max_retries: 3
    timeout_seconds: 60
